# corpus — egress allowlist proxy config (a WALL).
#
# Default-deny: tinyproxy forwards a request ONLY if the destination host
# matches a regex in allowlist.txt. Everything else — including RFC1918, the
# Docker network, and cloud-metadata (169.254.169.254) — is refused, because
# nothing in the allowlist matches them and FilterDefaultDeny is on.
#
# This file is host-only: mounted read-only into the PROXY container only,
# never into the agent box. The allowlist grows ONLY via a wall-change request
# that Theo stamps on the host (then restarts the proxy). The agent cannot
# edit it — it lives in walls/, outside the mounted sandbox/.

User tinyproxy
Group tinyproxy

# Listen on all interfaces WITHIN the proxy container; only the internal Docker
# network can reach it (the agent box), and the proxy is the only thing on that
# network with a route out.
Port 8888
Listen 0.0.0.0
Timeout 600

# Clients allowed to USE the proxy = the Docker bridge ranges the agent box
# lives on. This is "who may connect to the proxy", NOT "where they may go" —
# destination control is the Filter below. Broad here is fine; the box is the
# only client on the internal network.
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# ── The wall ──────────────────────────────────────────────────────────────
# Default-deny destination filtering. A request is forwarded only if its host
# matches a line in allowlist.txt (extended POSIX regex, case-insensitive).
Filter "/etc/tinyproxy/allowlist.txt"
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off
# Filter applies to CONNECT (HTTPS) hosts too — without this an agent could
# CONNECT-tunnel to anything. Restrict CONNECT to TLS, plain HTTP, and SSH
# (22, so git-over-SSH can tunnel through here to the allowlisted git host —
# the host allowlist still gates WHICH host, so only github.com:22 is
# reachable, not arbitrary :22).
ConnectPort 443
ConnectPort 80
ConnectPort 22

# No disk logging of bodies; keep a quiet connection log to stdout for the
# `docker logs proxy` audit trail.
LogLevel Connect
DisableViaHeader Yes
