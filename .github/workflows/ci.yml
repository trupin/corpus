name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One version number describes the tool (INFRA-008). Cheap, needs no
      # build, and the same script is the release workflow's tag/version guard.
      - name: version singularity
        run: npm run version:check
      # The issue tracker's two halves must agree (INFRA-027). Whole-tree by
      # nature — one file against 400 — so it is CI's rather than the commit
      # hook's, per CLAUDE.md's rule on where a check belongs. Needs no build,
      # so it sits here with the other cheap gates and fails in seconds.
      - name: issue tracker agreement
        run: npm run issues:check
      # Every `§N` in the tree must name a heading SPEC.md actually has
      # (INFRA-029). Here rather than in a hook, and the reasoning is not only
      # cost: the citation half is diff-scopable but the heading half is not, so
      # a staged-file version would pass the very commit that renumbers a section
      # and strands the citations elsewhere. The historical citation of a section
      # 9.4 survived eleven copies and four months and shipped in the client because
      # nothing looked; a PR-time failure is early enough, since nothing here is
      # unrecoverable after the fact. Needs no build — runs in under a second.
      - name: SPEC cross-references
        run: npm run spec:check
      # Supply-chain gate (INFRA-013): zero `npm audit` findings of ANY severity.
      # Not `--audit-level` — that tolerates the `info` bucket — but a
      # `metadata.vulnerabilities.total === 0` assertion, which has no floor.
      # There is still no allowlist, no waiver file and no per-package skip. What
      # INFRA-021 added instead (user decision 2026-08-06) is a register of dated
      # exceptions in `scripts/audit-report.ts`, each keyed on one GHSA id AND the
      # dependency route `package-lock.json` declares, each with a hard expiry, and
      # each printed in full on every run — so a carried finding is visible in this
      # job's log and the success line says the tree is not clean. It fails closed
      # on expiry, on a route change, and on a route that stops being dev-only.
      # Early and before `npm run build` so it costs a registry round-trip rather
      # than a full compile. Fail-closed by omission — the pre-commit hook passes
      # `--tolerate-unreachable-registry`, and this step deliberately does not, so
      # an unreachable registry fails CI instead of quietly reporting success.
      # That flag now covers an unanswering registry and nothing else (INFRA-015):
      # npm failing to start, being killed, or writing more than the capture
      # buffer holds is a check that did not run, and fails closed in BOTH
      # callers. Before that, an overflowing report read as "the registry did not
      # answer" and the local hook proceeded — on exactly the trees with the most
      # findings.
      - name: npm audit (zero findings, any severity)
        run: node --import tsx scripts/check-audit.ts
      # Build first: cross-workspace imports resolve through each package's
      # exports map into dist/, so lint/typecheck/tests need the emit to exist.
      - run: npm run build
      # Assemble the publishable package and audit the tarball npm pack would
      # produce, in both directions: every artifact the installed tool resolves
      # must be present, and no development state may leak. A packaging bug is
      # otherwise invisible until someone installs on a machine with no repo.
      - name: package build + tarball audit
        run: |
          npm run package:build
          npm run pack:check
      # Regenerates every committed generated artifact (openapi.json,
      # schema.generated.ts, docs/cli.md) and fails when the result differs from
      # what was committed. Shares one inventory with .githooks/pre-push.
      - name: generated artifacts drift
        run: node --import tsx scripts/check-generated-artifacts.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # unit → e2e → merge → gate. The unit run enforces no threshold of its own
      # (INFRA-004): it emits raw istanbul coverage, the e2e run emits raw V8,
      # and the merged report below is the single place the 90% bar is applied.
      # `--includeTaskLocation` and the extra JSON reporter cost this run nothing
      # and are what let the budget report below join each test to the timeout its
      # own source declares. No second suite run is spent on it.
      - name: unit tests (raw coverage, no gate)
        run: |
          mkdir -p coverage-raw
          npm run test:coverage -- --includeTaskLocation \
            --reporter=default --reporter=json \
            --outputFile.json=coverage-raw/vitest-results.json
      # Names every test at or above 50% of its own timeout budget — the class that
      # cannot be told apart from a regression when it goes red (INFRA-020).
      #
      # **Findings do not fail this job, and a report that could not be produced
      # does.** There is no `continue-on-error` here and that is deliberate: the
      # script exits 0 with findings and 1 only when it measured nothing. Findings
      # must not block because the numerator is wall-clock time on a shared runner,
      # so a blocking form would go red because the runner was busy — the exact
      # failure the check exists to prevent. A missing report must block, because a
      # check that did not run has to say so rather than print a clean summary it
      # did not earn (the INFRA-015 rule, applied here).
      #
      # Making findings block is a gate-policy decision and is the user's.
      - name: slow-test budget report (findings do not block; a missing report does)
        if: always()
        run: npm run test:slow:report
      # The `compgen -G "apps/ui/e2e/*.spec.ts"` guard that used to wrap this is
      # gone: the specs exist, and e2e output is now an INPUT to the gate. A run
      # that quietly produced none has to fail, not skip.
      - name: e2e (Playwright, browser V8 coverage)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: merged coverage gate (unit + e2e, >=90%)
        run: npm run coverage:merge
      - name: upload merged coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-coverage
          path: coverage/merged
          if-no-files-found: warn
