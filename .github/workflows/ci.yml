name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One version number describes the tool (INFRA-008). Cheap, needs no
      # build, and the same script is the release workflow's tag/version guard.
      - name: version singularity
        run: npm run version:check
      # Supply-chain gate (INFRA-013): zero `npm audit` findings of ANY severity.
      # Not `--audit-level` — that tolerates the `info` bucket — but a
      # `metadata.vulnerabilities.total === 0` assertion, which has no floor.
      # There is no allowlist, no waiver file and no per-package skip, by user
      # directive: an advisory nobody can fix is an escalation, not a mechanism.
      # Early and before `npm run build` so it costs a registry round-trip rather
      # than a full compile. Fail-closed by omission — the pre-commit hook passes
      # `--tolerate-unreachable-registry`, and this step deliberately does not, so
      # an unreachable registry fails CI instead of quietly reporting success.
      - name: npm audit (zero findings, any severity)
        run: node --import tsx scripts/check-audit.ts
      # Build first: cross-workspace imports resolve through each package's
      # exports map into dist/, so lint/typecheck/tests need the emit to exist.
      - run: npm run build
      # Assemble the publishable package and audit the tarball npm pack would
      # produce, in both directions: every artifact the installed tool resolves
      # must be present, and no development state may leak. A packaging bug is
      # otherwise invisible until someone installs on a machine with no repo.
      - name: package build + tarball audit
        run: |
          npm run package:build
          npm run pack:check
      # Regenerates every committed generated artifact (openapi.json,
      # schema.generated.ts, docs/cli.md) and fails when the result differs from
      # what was committed. Shares one inventory with .githooks/pre-push.
      - name: generated artifacts drift
        run: node --import tsx scripts/check-generated-artifacts.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # unit → e2e → merge → gate. The unit run enforces no threshold of its own
      # (INFRA-004): it emits raw istanbul coverage, the e2e run emits raw V8,
      # and the merged report below is the single place the 90% bar is applied.
      - name: unit tests (raw coverage, no gate)
        run: npm run test:coverage
      # The `compgen -G "apps/ui/e2e/*.spec.ts"` guard that used to wrap this is
      # gone: the specs exist, and e2e output is now an INPUT to the gate. A run
      # that quietly produced none has to fail, not skip.
      - name: e2e (Playwright, browser V8 coverage)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: merged coverage gate (unit + e2e, >=90%)
        run: npm run coverage:merge
      - name: upload merged coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-coverage
          path: coverage/merged
          if-no-files-found: warn
