name: Release

# Tag-triggered. `npm version <x> --workspaces --include-workspace-root` writes
# the version everywhere and creates the tag; pushing it publishes.
on:
  push:
    tags:
      - "v*"

# `id-token: write` is what makes npm provenance possible: npm exchanges the
# workflow's OIDC token for a signed attestation tying the tarball to this
# commit of this public repository. `contents: read` is all the job needs.
permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Required for npm to authenticate and for provenance to be attached.
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # The tag/version guard. `check-versions.ts` reads GITHUB_REF: a
      # `refs/tags/v1.2.3` push against a manifest at any other version fails
      # here, before anything is built and long before anything is published.
      # It also fails if any workspace has drifted from the root version.
      - name: version singularity + tag guard
        run: npm run version:check

      # The full validate gate, same steps and same order as CI / validate. A
      # tag is not a licence to skip them: this is the last point where a broken
      # release can still be stopped, and an unpublish is not a rollback.
      - run: npm run build
      - name: generated artifacts drift
        run: node --import tsx scripts/check-generated-artifacts.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: unit tests (raw coverage, no gate)
        run: npm run test:coverage
      - name: e2e (Playwright, browser V8 coverage)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: merged coverage gate (unit + e2e, >=90%)
        run: npm run coverage:merge

      # Assemble the single published package and audit the tarball before it is
      # sent anywhere. `pack:check` asserts in both directions, so an empty or
      # half-staged package cannot slip past.
      - name: package build + tarball audit
        run: |
          npm run package:build
          npm run pack:check

      # Provenance requires a public repository and a GitHub Actions run; both
      # hold for github.com/trupin/corpus. The flag is unconditional on purpose:
      # a release that silently drops provenance is worse than one that fails,
      # because nothing downstream can tell the difference afterwards.
      #
      # Re-running this workflow on an existing tag fails cleanly rather than
      # half-publishing: the version guard above passes (tag and manifest still
      # agree), and `npm publish` then rejects the already-published version with
      # E403 "cannot publish over the previously published versions". Nothing is
      # mutated before that point — the tarball is built into a staging
      # directory, not into the source tree.
      - name: publish to npm with provenance
        working-directory: dist-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
