# The non-TS mirror of manifest.ts's docTypes (SPEC.md §10): the server and CLI
# read this file so they never load UI code. parity.test.ts asserts the two
# declarations agree in both directions.
#
# `seedTemplate` names a BODY-only template (SPEC.md §10 — "template pre-fill is
# body-only"): it contributes headings and starter task-list lines, never
# frontmatter. That works since PLUGINS-005 because items ARE body text
# (SPEC.md §12), which is what "its type's template can ship starter items in
# its body like any template pre-fill" means.
#
# `derived<Field>: true` declares that this type's core field is derived from
# the document's own content, never set — the non-TS half of the manifest's
# matching `derive<Field>` function. The flag is what lets the server and the
# CLI know a field is not anyone's to set without executing a line of plugin
# code; the executable derivations all live in `server/derive.ts`, one module
# for every field, so a second derived field is never a second discovery rule.
# `true` is the only spelling — absent means not derived, and `false` is not a
# way of saying so.
#
#   derivedStatus  SPEC.md §12, rider signed 2026-08-12 — a todo document's
#                  status is its items. `server/derive.ts`'s default export.
#   derivedDue     PLUGINS-018 — a todo document's deadline is its earliest
#                  open item's, which is what puts an item's `(due: …)` marker
#                  in front of §5's Attention, `--due overdue`, `--needs due`
#                  and `--needs me`. `server/derive.ts`'s `deriveDue` export.
types:
  - type: todo
    label: Todo
    seedTemplate: seeds/todo-template.md
    derivedStatus: true
    derivedDue: true
